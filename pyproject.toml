[project]
name = "dot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "tomlkit>=0.15.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatchling.build.targets.wheel]
packages = ["src/dot"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[project.scripts]
dot = "dot.main:main"
